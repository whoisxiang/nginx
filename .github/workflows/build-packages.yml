name: Build Nginx for CentOS 7 & Ubuntu 20.04

on:
  workflow_dispatch: # 支持手动触发，并可自定义 Nginx 版本
    inputs:
      nginx_version:
        description: 'Nginx 版本号 (例如 1.26.2)'
        required: true
        default: '1.30.7'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-nginx.yml'

env:
  NGINX_VERSION: ${{ github.event.inputs.nginx_version || '1.26.2' }}

jobs:
  build:
    name: Build Nginx (${{ matrix.os_name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: centos7
            image: centos:7
          - os_name: ubuntu20.04
            image: ubuntu:20.04

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 1. 安装编译依赖 (区分 CentOS 7 与 Ubuntu 20.04)
      # ---------------------------------------------------------
      - name: Install dependencies (CentOS 7)
        if: matrix.os_name == 'centos7'
        run: |
          # CentOS 7 已 EOL，必须切换至 vault.centos.org 源才能正常 yum install
          sed -i 's/mirrorlist/#mirrorlist/g' /etc/yum.repos.d/CentOS-*
          sed -i 's|#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g' /etc/yum.repos.d/CentOS-*
          yum clean all
          yum install -y gcc gcc-c++ make wget tar gzip \
            pcre-devel zlib-devel openssl-devel libxml2-devel libxslt-devel gd-devel

      - name: Install dependencies (Ubuntu 20.04)
        if: matrix.os_name == 'ubuntu20.04'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y build-essential wget tar gzip \
            libpcre3-dev zlib1g-dev libssl-dev libxml2-dev libxslt1-dev libgd-dev

      # ---------------------------------------------------------
      # 2. 下载并编译 Nginx
      # ---------------------------------------------------------
      - name: Download and Compile Nginx
        run: |
          wget -q https://nginx.org/download/nginx-${NGINX_VERSION}.tar.gz
          tar -zxf nginx-${NGINX_VERSION}.tar.gz
          cd nginx-${NGINX_VERSION}

          # 配置编译参数（可根据需求增减模块）
          ./configure \
            --prefix=/usr/local/nginx \
            --with-http_ssl_module \
            --with-http_v2_module \
            --with-http_realip_module \
            --with-http_stub_status_module \
            --with-http_gzip_static_module \
            --with-http_sub_module \
            --with-stream \
            --with-stream_ssl_module \
            --with-pcre \
            --with-threads

          # 多核并行编译并安装到临时打包目录
          make -j$(nproc)
          make install DESTDIR=${{ github.workspace }}/dist

      # ---------------------------------------------------------
      # 3. 验证编译产物并打包
      # ---------------------------------------------------------
      - name: Verify and Package
        run: |
          # 验证二进制文件是否能正常输出版本和编译参数
          ${{ github.workspace }}/dist/usr/local/nginx/sbin/nginx -V

          # 打包为 tar.gz
          cd ${{ github.workspace }}/dist/usr/local
          tar -zcf ${{ github.workspace }}/nginx-${NGINX_VERSION}-${{ matrix.os_name }}-x86_64.tar.gz nginx

      # ---------------------------------------------------------
      # 4. 上传编译产物到 GitHub Actions Artifacts
      # ---------------------------------------------------------
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-${{ env.NGINX_VERSION }}-${{ matrix.os_name }}
          path: nginx-${{ env.NGINX_VERSION }}-${{ matrix.os_name }}-x86_64.tar.gz
